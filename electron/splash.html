<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>文档瘦身工具</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    html, body {
      width: 100%;
      height: 100%;
      background: #ffffff;
      overflow: hidden;
      font-family: -apple-system, "Microsoft YaHei", "PingFang SC", sans-serif;
      user-select: none;
    }

    .container {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      gap: 0;
      animation: fadeIn 0.5s ease-in-out;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: scale(0.96); }
      to   { opacity: 1; transform: scale(1); }
    }

    .logo-wrap {
      animation: slideDown 0.6s ease-out 0.1s both;
    }
    @keyframes slideDown {
      from { opacity: 0; transform: translateY(-20px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .logo-wrap img {
      width: 220px;
      height: auto;
      display: block;
    }

    .divider {
      width: 80px;
      height: 3px;
      background: linear-gradient(90deg, #FAC02C, #f9a800);
      border-radius: 2px;
      margin: 22px 0 20px;
      animation: expandLine 0.8s ease-out 0.5s both;
    }
    @keyframes expandLine {
      from { width: 0; opacity: 0; }
      to   { width: 80px; opacity: 1; }
    }

    .slogan {
      color: #FAC02C;
      font-size: 18px;
      font-weight: 700;
      letter-spacing: 1.5px;
      text-align: center;
      line-height: 1.7;
      animation: slideUp 0.7s ease-out 0.7s both;
    }
    @keyframes slideUp {
      from { opacity: 0; transform: translateY(16px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .slogan span {
      display: block;
    }

    .loading-bar {
      margin-top: 36px;
      width: 200px;
      height: 3px;
      background: #f0f0f0;
      border-radius: 3px;
      overflow: hidden;
      animation: fadeInBar 0.4s ease 1s both;
    }
    @keyframes fadeInBar {
      from { opacity: 0; }
      to   { opacity: 1; }
    }

    .loading-fill {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, #FAC02C, #f9a800);
      border-radius: 3px;
      animation: loadProgress 2.2s ease-in-out 1.1s forwards;
    }
    @keyframes loadProgress {
      0%   { width: 0%; }
      40%  { width: 55%; }
      70%  { width: 75%; }
      90%  { width: 90%; }
      100% { width: 100%; }
    }

    .app-name {
      margin-top: 14px;
      font-size: 12px;
      color: #bbb;
      letter-spacing: 2px;
      animation: fadeInBar 0.4s ease 1s both;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="logo-wrap">
      <img src="../LOGO.png" alt="EGO International" />
    </div>

    <div class="divider"></div>

    <div class="slogan">
      <span>WORK HARD , WORK SMART ,</span>
      <span>HAVE FUN!</span>
    </div>

    <div class="loading-bar">
      <div class="loading-fill"></div>
    </div>

    <div class="app-name">文档瘦身工具 · EGO International</div>
  </div>
</body>
</html>
